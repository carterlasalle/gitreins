guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  test_command: uv run pytest -x --tb=short
  test_timeout: 900
  # lint_command resolves ruff through uv so the GitReins judge subprocess
  # (bare shell, .venv/bin not on its PATH) can find it. 'uv run ruff' works
  # from any PATH that has uv (login shell). Fixed 2026-08-08 — was failing
  # tier1 lint in every judge run with "ruff: command not found".
  lint_command: uv run ruff check .
  lint_mode: full
  dead_code: false
  skylos: false
  static_analysis: false
  # static_analysis disabled 2026-07-19: 2150 pre-existing mypy --strict errors.
  # Re-enable after GR-099 type annotation project. Ruff/lint covers quality meanwhile.
  static_analysis_tools:
    python:
    - mypy
  lsp: true
  lsp_tools:
  - pylsp
evaluator:
  max_iterations: 200
  max_time: 45m
  max_input_tokens: 10M
  max_output_tokens: 1M
  tool_call_weight: 0.1
  compaction_threshold: 0.9
  code_context_budget: 0.7
  file_scope: changed
  fast_track: auto
defaults:
  model: deepseek-v4-flash
history:
  enabled: true
  storage: git
  max_verdicts: 1000
